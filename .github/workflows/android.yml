name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Load fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GOLDORB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/goldorb-signing.p12"
            echo "GOLDORB_KEYSTORE_FILE=$RUNNER_TEMP/goldorb-signing.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::GOLDORB_KEYSTORE_BASE64 secret not set: APK is signed with a throwaway debug key and won't install over a previous build."
          fi

      - name: Unit tests and debug APK
        env:
          GOLDORB_KEYSTORE_PASSWORD: ${{ secrets.GOLDORB_KEYSTORE_PASSWORD }}
        run: ./gradlew :core:test :app:assembleDebug --stacktrace

      - name: Show signing certificate
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "SHA-256|DN"

      - uses: actions/upload-artifact@v4
        with:
          name: GoldORB-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
